name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      # One OS is enough for formatting; the rules do not depend on the platform.
      - if: runner.os == 'Windows'
        run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build -c Release --no-restore
      # --blame names the test that was running when a test host crashes; the output is kept for the next step.
      # The console logger stays at minimal (failures and crashes only): at normal it wrote a line per passed test, and on
      # windows-latest the runner itself died writing one (0xC0000005 in ConsoleLogger.TestResultHandler, 5 of 8 runs
      # after the pipe and --blame came in on 2026-10-09; no test of ours failed).
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test -c Release --no-build --blame --logger GitHubActions --logger "console;verbosity=minimal" 2>&1 | tee test-output.txt
      # A crashed or aborted test run reports no failing test, and job logs need a login to read. This puts the telling
      # lines into an annotation, which scripts/ci-status.mjs reads without one.
      - name: Summarise a failed test run
        if: failure()
        shell: bash
        run: |
          [ -f test-output.txt ] || exit 0
          crash=$(grep -E -A 25 "Fatal error|crashed|Stack overflow|Unhandled exception|aborted|The active test run" test-output.txt | head -n 80 || true)
          failed=$(grep -E "Failed [A-Za-z]|error CS|exited with error" test-output.txt | tail -n 20 || true)
          if [ -z "$crash$failed" ]; then lines=$(tail -n 40 test-output.txt); else lines="$crash"$'\n'"$failed"; fi
          encoded=$(printf '%s' "$lines" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=dotnet test output (${{ runner.os }})::${encoded}"
